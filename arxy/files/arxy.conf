# /etc/arxy/arxy.conf — configuracion del subsistema arxy.
# Precedencia: variables de entorno > ~/.config/arxy/config > este archivo.
# Copia esto a ~/.config/arxy/config si quieres overrides por usuario.
# Es un fichero de DATOS, no un script: una asignacion ARXY_CLAVE=valor por
# linea, con comillas simples/dobles opcionales. No expande $HOME ni ejecuta
# comandos. Las claves desconocidas se ignoran con aviso.

# Raiz del subsistema Arch (extraido). Todo lo instalado con 'arxy install'
# vive aqui dentro; el host no se toca.
ARXY_ROOT="/var/lib/arxy/root"

# Tarball de la imagen minima (tar.zst con usr/, etc/, var/ en el nivel superior).
# Lo construye el repo arxy-image (CI semanal) y se publica en su release
# 'latest'. Acepta https:// o file:// (util para probar imagenes locales).
ARXY_IMAGE_URL="https://github.com/SrDicov/arxy-image/releases/download/latest/arxy-rootfs-x86_64.tar.zst"

# sha256 del tarball. Normalmente VACIO: setup descarga y verifica contra el
# fichero .sha256 publicado junto al tarball en el release. Fijalo aqui solo
# si quieres anclar una imagen concreta (entonces manda sobre el .sha256).
ARXY_IMAGE_SHA256=""

# Firma minisign del tarball: required|optional|off (defecto:
# optional). optional verifica si puede (firma invalida = die, minisign
# ausente = aviso); required exige minisign y firma valida; off omite.
# La pubkey vive en /etc/arxy/arxy.pub (la instala el paquete).
ARXY_SIGNATURE_POLICY="optional"

# Allowlist del host-bridge por NOMBRES: se resuelven a paths al
# arrancar el daemon (lo que no resuelve se omite con aviso). Vacio = lista
# interna (steam wine gamescope mangohud xdg-open notify-send).
ARXY_BRIDGE_ALLOWLIST=""
